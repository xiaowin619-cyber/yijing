
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易经智慧 - I Ching Wisdom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif SC', serif;
            background-color: #f8f5f0;
            color: #2d2d2d;
        }
        .iching-line {
            height: 12px;
            margin-bottom: 8px;
            border-radius: 2px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .yang-line {
            background-color: #333;
            width: 100%;
        }
        .yin-line {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .yin-line div {
            background-color: #333;
            width: 45%;
            height: 100%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        @keyframes linePulse {
            0%, 100% { transform: scaleX(1); filter: brightness(1); }
            50% { transform: scaleX(1.02); filter: brightness(1.3) drop-shadow(0 0 10px rgba(185, 28, 28, 0.4)); }
        }
        .animate-changing-line {
            animation: linePulse 2s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>

</body>
</html>
